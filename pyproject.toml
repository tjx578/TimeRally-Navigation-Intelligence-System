[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-rally-navigation-intelligence-system"
version = "0.1.0"
description = "Local-first rally navigation intelligence system. Mengubah soal rally menjadi rute yang siap menang."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.5",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/rally_core/..",
  "packages/geo_engine/..",
  "packages/knowledge_engine/..",
  "packages/data_contracts/..",
  "services/api",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]
