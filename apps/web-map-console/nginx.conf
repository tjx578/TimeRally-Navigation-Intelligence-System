server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip dasar (brotli butuh modul tambahan; biarkan off di image alpine standar).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    application/javascript
    application/json
    application/wasm
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;

  # Security headers untuk SPA. Hardening tambahan dipasang lewat Traefik middleware.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hashed assets dari Vite (filename dengan hash) boleh di-cache 1 tahun immutable.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Gambar/icon: cache 7 hari, masih bisa di-rotate untuk re-branding.
  location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # PMTiles range requests: pastikan response tidak di-coalesce / re-buffered.
  location ~* \.pmtiles$ {
    add_header Cache-Control "no-cache" always;
    add_header Accept-Ranges "bytes" always;
    try_files $uri =404;
  }

  # SPA fallback: index.html jangan di-cache supaya deployment baru langsung terbaca.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }
}
