server {
  listen 8080;
  server_name _;

  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  # API proxy: semua /v1/... dikirim ke FastAPI Cloud Run.
  location /v1/ {
    proxy_pass https://timerally-api-qe5qpf2lyq-et.a.run.app/v1/;
    proxy_http_version 1.1;

    proxy_set_header Host timerally-api-qe5qpf2lyq-et.a.run.app;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_connect_timeout 60s;
    proxy_request_buffering off;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
  }

  location = /maps/bali-style.json {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /maps/ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html jangan di-cache supaya bundle JS hashed terbaru selalu terbaca.
  location = /index.html {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }
}
