name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-map-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web-map-console/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose
        run: docker compose -f infra/compose/docker-compose.dev.yml config
      - name: Validate production compose
        run: docker compose --env-file .env.prod.example -f infra/compose/docker-compose.prod.yml config
      - name: Validate offline Bali compose
        run: |
          OFFLINE_BALI_ROOT=/tmp/timerally/offline docker compose \
            -f infra/compose/docker-compose.dev.yml \
            -f infra/compose/docker-compose.offline-bali.yml config
      - name: Validate ops scripts
        run: bash -n infra/gcp/*.sh tools/offline-bali/*.sh ops/scripts/*.sh
