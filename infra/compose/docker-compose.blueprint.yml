services:
  api:
    build:
      context: ../../services/api
    env_file:
      - ../../.env
    ports:
      - "8000:8000"

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    ports:
      - "8002:8002"
    volumes:
      - ../../data/mapdata/osm_extracts:/custom_files

  osrm:
    image: osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"
    volumes:
      - ../../data/mapdata/osm_extracts:/data

  tileserver:
    image: maptiler/tileserver-gl:latest
    ports:
      - "8081:8080"
    volumes:
      - ../../data/mapdata/tiles:/data

  traccar:
    image: traccar/traccar:latest
    ports:
      - "8082:8082"

