name: timerally-routing-vm

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./routing-vm-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      osrm:
        condition: service_healthy
      tileserver:
        condition: service_healthy
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/${OSRM_FILE:-bali-mainland.osrm}
    volumes:
      - /srv/timerally/offline/osrm:/data:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- "http://127.0.0.1:5000/nearest/v1/driving/115.212629,-8.670458?number=1"
          | grep -q '"code":"Ok"' || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  tileserver:
    image: maptiler/tileserver-gl:latest
    command:
      - --public_url
      - "${TILESERVER_PUBLIC_URL:-/tiles/}"
      - --file
      - "/data/${MBTILES_FILE:-bali-latest.mbtiles}"
    volumes:
      - /srv/timerally/offline/tiles:/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    profiles: ["valhalla-standby"]
    environment:
      use_tiles_ignore_pbf: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      serve_tiles: "True"
      force_rebuild: "False"
    volumes:
      - /srv/timerally/offline/valhalla/custom_files:/custom_files
    restart: unless-stopped

